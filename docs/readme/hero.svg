<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#17222b"/>
    </pattern>
    <radialGradient id="halo" cx="50%" cy="30%" r="65%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".14"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .card { fill: #0b1116; stroke: #1d2731; stroke-width: 1.5; }
    .hl { fill: none; stroke: #22d3ee; stroke-width: 1.5; opacity: 0; animation: hl 6s infinite; }
    .glow { fill: #22d3ee; opacity: 0; filter: url(#blur); animation: glow 6s infinite; }
    .d1 { animation-delay: 1.5s; } .d2 { animation-delay: 3s; } .d3 { animation-delay: 4.5s; }
    @keyframes hl { 0% { opacity: 0 } 3% { opacity: 1 } 18% { opacity: 1 } 24% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes glow { 0% { opacity: 0 } 3% { opacity: .22 } 18% { opacity: .22 } 24% { opacity: 0 } 100% { opacity: 0 } }
    .flow { stroke: #22d3ee; stroke-width: 2; stroke-dasharray: 6 7; animation: dash 1s linear infinite; }
    .hire { fill: none; stroke: #22d3ee; stroke-opacity: .35; stroke-width: 1.5; stroke-dasharray: 3 6; animation: dash 2.4s linear infinite reverse; }
    @keyframes dash { to { stroke-dashoffset: -26; } }
    .blink { animation: blink 2s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .name { fill: #f1f5f9; font-size: 16px; font-weight: 700; }
    .desc { fill: #8b98a5; font-size: 12.5px; }
    .status { fill: #5b6975; font-size: 10.5px; letter-spacing: .1em; }
  </style>

  <rect width="1280" height="470" rx="18" fill="#05080a"/>
  <rect width="1280" height="470" rx="18" fill="url(#dots)"/>
  <rect width="1280" height="470" rx="18" fill="url(#halo)"/>

  <text x="640" y="46" text-anchor="middle" class="mono" fill="#22d3ee" font-size="12" letter-spacing="3">TELSTRA MURU-D · TEAM 2</text>
  <text x="640" y="104" text-anchor="middle" fill="#ffffff" font-size="56" font-weight="800" letter-spacing="-1.5">Agent Mesh</text>
  <text x="640" y="142" text-anchor="middle" fill="#8b98a5" font-size="19">Put a team of AI agents on a canvas. Draw arrows between them. Watch the idea get built.</text>

  <!-- orchestrator "hiring" lines -->
  <path class="hire" d="M640,372 C640,338 190,338 190,304"/>
  <path class="hire" d="M640,372 C640,338 490,338 490,304"/>
  <path class="hire" d="M640,372 C640,338 790,338 790,304"/>
  <path class="hire" d="M640,372 C640,338 1090,338 1090,304"/>

  <!-- context arrows -->
  <line class="flow" x1="300" y1="252" x2="380" y2="252"/>
  <line class="flow" x1="600" y1="252" x2="680" y2="252"/>
  <line class="flow" x1="900" y1="252" x2="980" y2="252"/>

  <!-- cards -->
  <g>
    <rect class="glow" x="80" y="200" width="220" height="104" rx="14"/>
    <rect class="card" x="80" y="200" width="220" height="104" rx="14"/>
    <rect class="hl" x="80" y="200" width="220" height="104" rx="14"/>
    <rect x="96" y="216" width="28" height="28" rx="7" fill="none" stroke="#2a3642"/>
    <path d="M110,223 l7,7 l-7,7 l-7,-7 z" fill="#22d3ee"/>
    <text x="134" y="235" class="name">Market Research</text>
    <text x="96" y="266" class="desc">Digs up the market and rivals</text>
    <circle cx="100" cy="286" r="3" fill="#22d3ee" class="blink"/>
    <text x="110" y="290" class="status mono">READY</text>
  </g>
  <g>
    <rect class="glow d1" x="380" y="200" width="220" height="104" rx="14"/>
    <rect class="card" x="380" y="200" width="220" height="104" rx="14"/>
    <rect class="hl d1" x="380" y="200" width="220" height="104" rx="14"/>
    <rect x="396" y="216" width="28" height="28" rx="7" fill="none" stroke="#2a3642"/>
    <path d="M410,223 l7,7 l-7,7 l-7,-7 z" fill="none" stroke="#22d3ee" stroke-width="1.6"/>
    <text x="434" y="235" class="name">Project Scoping</text>
    <text x="396" y="266" class="desc">Turns it into a clear brief</text>
    <circle cx="400" cy="286" r="3" fill="#22d3ee" class="blink"/>
    <text x="410" y="290" class="status mono">READY</text>
  </g>
  <g>
    <rect class="glow d2" x="680" y="200" width="220" height="104" rx="14"/>
    <rect class="card" x="680" y="200" width="220" height="104" rx="14"/>
    <rect class="hl d2" x="680" y="200" width="220" height="104" rx="14"/>
    <rect x="696" y="216" width="28" height="28" rx="7" fill="none" stroke="#2a3642"/>
    <path d="M710,221 l2.5,6.5 l6.5,2.5 l-6.5,2.5 l-2.5,6.5 l-2.5,-6.5 l-6.5,-2.5 l6.5,-2.5 z" fill="#22d3ee"/>
    <text x="734" y="235" class="name">UX/UI Design</text>
    <text x="696" y="266" class="desc">Sketches the screens and flows</text>
    <circle cx="700" cy="286" r="3" fill="#22d3ee" class="blink"/>
    <text x="710" y="290" class="status mono">READY</text>
  </g>
  <g>
    <rect class="glow d3" x="980" y="200" width="220" height="104" rx="14"/>
    <rect class="card" x="980" y="200" width="220" height="104" rx="14"/>
    <rect class="hl d3" x="980" y="200" width="220" height="104" rx="14"/>
    <rect x="996" y="216" width="28" height="28" rx="7" fill="none" stroke="#2a3642"/>
    <text x="1010" y="235" text-anchor="middle" class="mono" fill="#22d3ee" font-size="11" font-weight="700">&lt;/&gt;</text>
    <text x="1034" y="235" class="name">Coding</text>
    <text x="996" y="266" class="desc">Builds it in a live sandbox</text>
    <circle cx="1000" cy="286" r="3" fill="#22d3ee" class="blink"/>
    <text x="1010" y="290" class="status mono">READY</text>
  </g>

  <!-- ports -->
  <g fill="#05080a" stroke="#22d3ee" stroke-width="2">
    <circle cx="80" cy="252" r="6" stroke="#3a4753"/>
    <circle cx="380" cy="252" r="6"/><circle cx="680" cy="252" r="6"/><circle cx="980" cy="252" r="6"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="300" cy="252" r="6"/><circle cx="600" cy="252" r="6"/><circle cx="900" cy="252" r="6"/><circle cx="1200" cy="252" r="6"/>
  </g>

  <!-- handoff pulses -->
  <g fill="#e0fbff">
    <circle cy="252" r="5">
      <animate attributeName="cx" values="300;300;380;380" keyTimes="0;.167;.25;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.167;.25;.26;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cy="252" r="5">
      <animate attributeName="cx" values="600;600;680;680" keyTimes="0;.417;.5;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.41;.417;.5;.51;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cy="252" r="5">
      <animate attributeName="cx" values="900;900;980;980" keyTimes="0;.667;.75;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.66;.667;.75;.76;1" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- orchestrator -->
  <rect x="520" y="372" width="240" height="70" rx="14" fill="#0b1116" stroke="#22d3ee" stroke-opacity=".5" stroke-width="1.5"/>
  <rect x="536" y="393" width="28" height="28" rx="7" fill="none" stroke="#2a3642"/>
  <path d="M550,400 l7,7 l-7,7 l-7,-7 z" fill="#22d3ee"/>
  <text x="576" y="404" class="name">Orchestrator</text>
  <text x="576" y="424" class="desc">Plans the work, hires the team</text>
</svg>
