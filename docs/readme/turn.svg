<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 296" width="1280" height="296">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#141e26"/>
    </pattern>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee" fill-opacity=".6"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .card { fill: #0b1116; stroke: #1d2731; stroke-width: 1.5; }
    .hl { fill: none; stroke: #22d3ee; stroke-width: 1.5; opacity: 0; animation: hl 8s infinite; }
    .glow { fill: #22d3ee; opacity: 0; filter: url(#blur); animation: glow 8s infinite; }
    .d1 { animation-delay: 1.3s; } .d2 { animation-delay: 2.6s; } .d3 { animation-delay: 3.9s; } .d4 { animation-delay: 5.2s; }
    @keyframes hl { 0% { opacity: 0 } 3% { opacity: 1 } 16% { opacity: 1 } 20% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes glow { 0% { opacity: 0 } 3% { opacity: .2 } 16% { opacity: .2 } 20% { opacity: 0 } 100% { opacity: 0 } }
    .flow { stroke: #22d3ee; stroke-width: 2; stroke-dasharray: 5 6; animation: dash 1s linear infinite; }
    .loop { fill: none; stroke: #22d3ee; stroke-opacity: .6; stroke-width: 1.5; stroke-dasharray: 4 6; animation: dash 1.6s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -22; } }
    .num { fill: #22d3ee; font-size: 11px; letter-spacing: .15em; }
    .name { fill: #f1f5f9; font-size: 19px; font-weight: 700; }
    .desc { fill: #8b98a5; font-size: 13px; }
  </style>

  <rect width="1280" height="296" rx="18" fill="#05080a"/>
  <rect width="1280" height="296" rx="18" fill="url(#dots)"/>

  <!-- tool result loops back to the agent -->
  <path class="loop" d="M600,100 C600,48 450,48 450,98" marker-end="url(#head)"/>
  <text x="525" y="40" text-anchor="middle" fill="#5b6975" font-size="12">result goes back, the agent keeps writing</text>

  <!-- connectors -->
  <line class="flow" x1="276" y1="160" x2="311" y2="160"/>
  <line class="flow" x1="507" y1="160" x2="542" y2="160"/>
  <line class="flow" x1="738" y1="160" x2="773" y2="160"/>
  <line class="flow" x1="969" y1="160" x2="1004" y2="160"/>

  <!-- stations -->
  <g>
    <rect class="glow" x="80" y="100" width="196" height="120" rx="14"/>
    <rect class="card" x="80" y="100" width="196" height="120" rx="14"/>
    <rect class="hl" x="80" y="100" width="196" height="120" rx="14"/>
    <text x="100" y="128" class="num mono">01</text>
    <text x="100" y="156" class="name">You</text>
    <text x="100" y="182" class="desc">type a message</text>
    <text x="100" y="200" class="desc">and hit Send</text>
  </g>
  <g>
    <rect class="glow d1" x="311" y="100" width="196" height="120" rx="14"/>
    <rect class="card" x="311" y="100" width="196" height="120" rx="14"/>
    <rect class="hl d1" x="311" y="100" width="196" height="120" rx="14"/>
    <text x="331" y="128" class="num mono">02</text>
    <text x="331" y="156" class="name">Agent</text>
    <text x="331" y="182" class="desc">reads its arrows,</text>
    <text x="331" y="200" class="desc">picks a tool</text>
  </g>
  <g>
    <rect class="glow d2" x="542" y="100" width="196" height="120" rx="14"/>
    <rect class="card" x="542" y="100" width="196" height="120" rx="14"/>
    <rect class="hl d2" x="542" y="100" width="196" height="120" rx="14"/>
    <text x="562" y="128" class="num mono">03</text>
    <text x="562" y="156" class="name">Tools</text>
    <text x="562" y="182" class="desc">search, fetch, GitHub…</text>
    <text x="562" y="200" class="desc">or wait for your OK</text>
  </g>
  <g>
    <rect class="glow d3" x="773" y="100" width="196" height="120" rx="14"/>
    <rect class="card" x="773" y="100" width="196" height="120" rx="14"/>
    <rect class="hl d3" x="773" y="100" width="196" height="120" rx="14"/>
    <text x="793" y="128" class="num mono">04</text>
    <text x="793" y="156" class="name">Sandbox</text>
    <text x="793" y="182" class="desc">writes files,</text>
    <text x="793" y="200" class="desc">runs a server</text>
  </g>
  <g>
    <rect class="glow d4" x="1004" y="100" width="196" height="120" rx="14"/>
    <rect class="card" x="1004" y="100" width="196" height="120" rx="14"/>
    <rect class="hl d4" x="1004" y="100" width="196" height="120" rx="14"/>
    <text x="1024" y="128" class="num mono">05</text>
    <text x="1024" y="156" class="name">Preview</text>
    <text x="1024" y="182" class="desc">shows up live</text>
    <text x="1024" y="200" class="desc">in your browser</text>
  </g>

  <!-- handoff pulses -->
  <g fill="#e0fbff">
    <circle cy="160" r="5">
      <animate attributeName="cx" values="276;276;311;311" keyTimes="0;.119;.1625;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.118;.119;.1625;.17;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cy="160" r="5">
      <animate attributeName="cx" values="507;507;542;542" keyTimes="0;.281;.325;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.28;.281;.325;.33;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cy="160" r="5">
      <animate attributeName="cx" values="738;738;773;773" keyTimes="0;.444;.4875;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.443;.444;.4875;.495;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cy="160" r="5">
      <animate attributeName="cx" values="969;969;1004;1004" keyTimes="0;.606;.65;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.605;.606;.65;.66;1" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="640" y="264" text-anchor="middle" fill="#5b6975" font-size="14">The whole turn runs on the server. Close the tab, come back later, it's still there.</text>
</svg>
